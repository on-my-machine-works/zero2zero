name: Package Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (empty = v<__version__> from python/z2z/__init__.py)'
        required: false
        default: ''
        type: string
      release_summary:
        description: 'Optional release changelog line'
        required: false
        default: ''
        type: string
      runner:
        description: 'Runner image'
        required: false
        default: 'ubuntu-24.04-arm'
        type: choice
        options:
          - ubuntu-24.04-arm
          - ubuntu-24.04

permissions:
  contents: write

concurrency:
  group: zero2zero-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Test and Release
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          pkgs=(
            build-essential pkg-config dpkg-dev binutils
            python3 python3-gi gir1.2-glib-2.0
            curl ca-certificates
          )
          if [[ "$(uname -m)" != "aarch64" ]]; then
            pkgs+=(gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu)
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${pkgs[@]}"

      - name: Run self-tests and build arm64 package
        id: build
        run: |
          py_ver="$(python3 -c 'import sys; sys.path.insert(0, "python"); import z2z; print(z2z.__version__)')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="v${py_ver}"
          fi
          ver="${tag#v}"

          # Run host UI PPM check, Python unit/IPC suite, and ASan/UBSan .fap harness
          make clean
          make check

          # Build arm64 .deb (cross-compiling z2z-ui only if runner is not aarch64)
          if [[ "$(uname -m)" != "aarch64" ]]; then
            make clean
            CC=aarch64-linux-gnu-gcc make build
            aarch64-linux-gnu-strip --strip-unneeded src/z2z-ui
            VERSION="${ver}" ARCH=arm64 ./packaging/build-deb.sh
          else
            VERSION="${ver}" ARCH=arm64 make deb
          fi

          rm -rf release && mkdir -p release
          cp "dist/zero2zero_${ver}_arm64.deb" "release/zero2zero_${ver}_arm64.deb"
          cp "dist/zero2zero_${ver}_arm64.deb" "release/zero2zero_arm64.deb"
          cp "flipper_app/dist/zero2zero.fap" "release/zero2zero.fap"
          (
            cd release
            sha256sum zero2zero_arm64.deb "zero2zero_${ver}_arm64.deb" zero2zero.fap > SHA256SUMS
          )
          cat release/SHA256SUMS
          ls -lh release/

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.build.outputs.tag }}
          VER: ${{ steps.build.outputs.ver }}
          RELEASE_SUMMARY: ${{ inputs.release_summary || '' }}
        run: |
          deb_size="$(du -h "release/zero2zero_${VER}_arm64.deb" | awk '{print $1}')"
          fap_size="$(du -h "release/zero2zero.fap" | awk '{print $1}')"
          deb_sha="$(awk '/  zero2zero_arm64\.deb$/{print $1}' release/SHA256SUMS)"
          fap_sha="$(awk '/  zero2zero\.fap$/{print $1}' release/SHA256SUMS)"

          {
            echo "## \`zero2zero\` \`${TAG}\`"
            echo ""
            echo "BLE companion package for [Kali Linux on M5Stack CardputerZero](https://github.com/on-my-machine-works/kali-on-cardputerzero) and Flipper Zero. Bundles \`z2z-ui\`, \`z2z\`, \`z2zd\`, and prebuilt \`zero2zero.fap\` (\`v${VER}\`)."
            if [[ -n "${RELEASE_SUMMARY}" ]]; then
              echo ""
              echo "### Changes"
              echo "- ${RELEASE_SUMMARY}"
            fi
            echo ""
            echo "### Checksums (\`SHA-256\`)"
            echo "| File | Size | SHA-256 |"
            echo "| :--- | :---: | :--- |"
            echo "| \`zero2zero_arm64.deb\` / \`zero2zero_${VER}_arm64.deb\` | \`${deb_size}\` | \`${deb_sha}\` |"
            echo "| \`zero2zero.fap\` *(also bundled inside \`.deb\`)* | \`${fap_size}\` | \`${fap_sha}\` |"
            echo ""
            echo "### Install on CardputerZero"
            echo '```bash'
            echo "# Via KaliPkgs helper (verifies SHA-256 automatically):"
            echo "sudo cz-kali-pkgs install zero2zero"
            echo ""
            echo "# Or install directly from release assets:"
            echo "curl -fsSLO https://github.com/on-my-machine-works/zero2zero/releases/download/${TAG}/zero2zero_arm64.deb"
            echo "curl -fsSLO https://github.com/on-my-machine-works/zero2zero/releases/download/${TAG}/SHA256SUMS"
            echo "grep '  zero2zero_arm64.deb\$' SHA256SUMS | sha256sum -c -"
            echo "sudo dpkg -i zero2zero_arm64.deb"
            echo '```'
          } > /tmp/release-notes.md

          assets=(
            "release/zero2zero_arm64.deb"
            "release/zero2zero_${VER}_arm64.deb"
            "release/zero2zero.fap"
            "release/SHA256SUMS"
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
            gh release edit "${TAG}" --title "zero2zero ${TAG}" --notes-file /tmp/release-notes.md --latest
          else
            gh release create "${TAG}" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "zero2zero ${TAG}" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
